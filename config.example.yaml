# token-saver 示例配置
# 使用前: 复制为 config.yaml 并填入真实 api_key；
# 也可不写 api_key，改用环境变量 OPENAI_API_KEY。

provider:
  # 任意 OpenAI 兼容接口，示例:
  #   OpenAI:      https://api.openai.com/v1
  #   DeepSeek:    https://api.deepseek.com/v1
  #   通义千问:    https://dashscope.aliyuncs.com/compatible-mode/v1
  #   智谱 GLM:    https://open.bigmodel.cn/api/paas/v4
  #   本地 vLLM:   http://127.0.0.1:8000/v1
  base_url: "https://api.openai.com/v1"
  api_key: ""                 # 留空则读取环境变量 OPENAI_API_KEY
  model: "gpt-4o-mini"
  timeout: 60

compression:
  enabled: true               # 启用文本压缩
  remove_blank_lines: true    # 折叠连续空行
  remove_code_comments: true  # 移除代码块内单行注释
  collapse_whitespace: true   # 折叠连续空格/行尾空白
  reserved_keywords: []       # 需要保留原样的关键词，如 ["def", "class"]

context:
  enabled: true               # 启用上下文裁剪
  max_messages: 10            # 滑动窗口保留最近消息条数
  summary_after: 20           # 消息总数超过该值时对旧消息折叠摘要
  use_llm_summary: false      # 是否用模型生成语义摘要（false 用启发式折叠，更省 token）

cache:
  enabled: true               # 启用相似请求缓存
  ttl_seconds: 3600           # 缓存有效期（秒）
  similarity_threshold: 0.95  # 相似度阈值，0~1，越大越严格
  max_entries: 512            # 缓存最大条目数

proxy:
  host: "127.0.0.1"
  port: 8000
